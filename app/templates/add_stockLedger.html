{% extends "base.html" %}
{% block title %}Add Stock Ledger{% endblock %}

{% block content %}
<h2 class="heading">Add Stock Ledger</h2>
<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="product_id">Product:</label>
                <select name="product_id" required>
                    <option value="">-- Select Product --</option>
                    {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="warehouse_id">Warehouse Name:</label>
                <select name="warehouse_id" required>
                    <option value="">-- Select Warehouse --</option>
                    {% for warehouse in warehouses %}
                    <option value="{{ warehouse.id }}">{{ warehouse.name }}</option>
                    {% endfor %}
                </select>
            </div>
             <div class="form-group">
                <label for="warehouse_location_id">Warehouse Location:</label>
                <select name="warehouse_location_id" required>
                    <option value="">-- Select Warehouse Location --</option>
                    {% for location in warehouseLocations %}
                    <option value="{{ location.id }}">{{ location.location }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" name="quantity" min="1" required>
            </div>
        </div>
        <div class="form-actions">
            <button class="form-btn-2" type="submit">Save</button>
            <a  href="{{ url_for('dashboard.stock_ledger') }}"><button class="cancel-btn" type="button">Cancel</button></a>
        </div>
    </form>
</div>
{% endblock %}
