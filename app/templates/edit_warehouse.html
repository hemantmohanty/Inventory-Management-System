{% extends "base.html" %}

{% block content %}
<h2 class="heading">Edit WarehouseName</h2>
<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Warehouse Name</label>
                <input type="text" id="name" name="name" value="{{ wareh.name }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button class="form-btn-2" type="submit">Update</button>
            <a class="cancel-btn" href="{{ url_for('dashboard.warehouse') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
