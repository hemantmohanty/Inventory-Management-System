{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <div class="login-box">
    <h2>Create account</h2>
    <form method="POST" action="{{ url_for('login.register', next=request.args.get('next')) }}">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text"
               pattern="^[A-Za-z0-9_]{3,30}$"
               title="Use 3–30 characters: letters, numbers, underscore"
               autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password"
               minlength="6" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" name="confirm_password" type="password"
               minlength="6" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <p style="text-align:center; margin-top:10px;">
      Already have an account?
      <a href="{{ url_for('login.login', next=request.args.get('next')) }}">Log in</a>
    </p>
  </div>
{% endblock %}
