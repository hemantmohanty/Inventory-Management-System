{% extends "base.html" %}

{% block content %}
<h2 class="heading">Edit Product</h2>
<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" name="name" id="name" value="{{ prod.name }}" required>
            </div>
            <div class="form-group">
                <label for="group">Group</label>
                <input type="text" name="group" id="group" value="{{ prod.group }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price</label>
                <input type="text" name="price" id="price" value="{{ prod.price }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" name="description" id="description" value="{{ prod.description }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button class="form-btn-2" type="submit">Update</button>
            <a class="cancel-btn" href="{{ url_for('dashboard.product') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
