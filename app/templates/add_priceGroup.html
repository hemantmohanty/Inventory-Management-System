{% extends "base.html" %}

{% block content %}
<h2 class="heading">Add PriceGroup</h2>
<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Add PriceGroup</label>
                <input type="text" id="name" name="name" required>
            </div>
        </div>
        <div class="form-actions">
            <button class="form-btn-2" type="submit">Save</button>
            <a class="cancel-btn" href="{{ url_for('dashboard.price_group') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
